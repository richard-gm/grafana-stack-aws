name: Terraform

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TERRAFORM_VERSION: "1.7.0"
  TERRAGRUNT_VERSION: "1.1.4"
  GITHUB_ORG: ${{ github.repository_owner }}
  GITHUB_REPO: ${{ github.event.repository.name }}

jobs:
  detect-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      account_id: ${{ steps.set-env.outputs.account_id }}
      role_arn: ${{ steps.set-env.outputs.role_arn }}
      bucket: ${{ steps.set-env.outputs.bucket }}
    steps:
      - name: Set environment
        id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]] || [[ "${{ github.base_ref }}" == "develop" ]]; then
            echo "environment=nonprod" >> $GITHUB_OUTPUT
            echo "account_id=${{ vars.AWS_ACCOUNT_ID_NONPROD }}" >> $GITHUB_OUTPUT
            echo "role_arn=arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_NONPROD }}:role/grafana-stack-github-actions-nonprod" >> $GITHUB_OUTPUT
            echo "bucket=monitoring-scripts-${{ vars.AWS_ACCOUNT_ID_NONPROD }}-nonprod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]] || [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "account_id=${{ vars.AWS_ACCOUNT_ID_PROD }}" >> $GITHUB_OUTPUT
            echo "role_arn=arn:aws:iam::${{ vars.AWS_ACCOUNT_ID_PROD }}:role/grafana-stack-github-actions-prod" >> $GITHUB_OUTPUT
            echo "bucket=monitoring-scripts-${{ vars.AWS_ACCOUNT_ID_PROD }}-prod" >> $GITHUB_OUTPUT
          fi

  terraform-plan:
    needs: detect-environment
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      TG_ENV: ${{ needs.detect-environment.outputs.environment }}
      AWS_ACCOUNT_ID_NONPROD: ${{ vars.AWS_ACCOUNT_ID_NONPROD }}
      AWS_ACCOUNT_ID_PROD: ${{ vars.AWS_ACCOUNT_ID_PROD }}
    defaults:
      run:
        working-directory: environments/${{ needs.detect-environment.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.detect-environment.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Terragrunt
        run: |
          curl -fsSL "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Cache Terragrunt
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.terragrunt-cache
          key: terragrunt-${{ runner.os }}-${{ hashFiles('terragrunt.hcl', '**/terragrunt.hcl', 'root.hcl', '_env/*.hcl') }}

      - name: Terragrunt Init
        run: terragrunt run --all init --non-interactive

      - name: Terragrunt Validate
        run: terragrunt run --all validate --non-interactive

      - name: Lint monitoring scripts
        run: python3 -m py_compile src/lambda_handler.py src/monitoring_sdk/*.py monitoring-scripts/*.py

      - name: Terragrunt Plan
        id: plan
        run: terragrunt run --all plan --non-interactive -- -input=false -no-color
        continue-on-error: true

      - name: Comment PR with Plan
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `#### Terraform Plan Result 📖\n\`${{ steps.plan.outcome }}\`\n\n<details><summary>Show Plan</summary>\n\n\`\`\`hcl\n${{ steps.plan.outputs.stdout }}\n\`\`\`\n\n</details>\n\n*Triggered by @${{ github.actor }} on \`${{ github.head_ref }}\`*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Fail on Plan Error
        if: steps.plan.outcome == 'failure'
        run: exit 1

  terraform-apply:
    needs: detect-environment
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    env:
      TG_ENV: ${{ needs.detect-environment.outputs.environment }}
      AWS_ACCOUNT_ID_NONPROD: ${{ vars.AWS_ACCOUNT_ID_NONPROD }}
      AWS_ACCOUNT_ID_PROD: ${{ vars.AWS_ACCOUNT_ID_PROD }}
    defaults:
      run:
        working-directory: environments/${{ needs.detect-environment.outputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.detect-environment.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Terragrunt
        run: |
          curl -fsSL "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Terragrunt Init
        run: terragrunt run --all init --non-interactive

      - name: Lint monitoring scripts
        run: python3 -m py_compile src/lambda_handler.py src/monitoring_sdk/*.py monitoring-scripts/*.py

      - name: Terragrunt Apply
        run: terragrunt run --all apply --non-interactive --parallelism 4

  upload-scripts:
    needs: [detect-environment, terraform-apply]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.detect-environment.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync monitoring scripts to S3
        run: |
          aws s3 sync monitoring-scripts/ s3://${{ needs.detect-environment.outputs.bucket }}/ --delete \
            --exclude "__pycache__/*" --exclude "*.pyc"
