[paths]
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins
provisioning = /etc/grafana/provisioning

[server]
protocol = http
http_port = 3000
domain = localhost

[database]
type = sqlite3
path = /var/lib/grafana/grafana.db

[session]
provider = sqlite3

[analytics]
reporting_enabled = false

[security]
admin_user = admin
admin_password = admin
disable_gravatar = true

[users]
allow_sign_up = false

[auth]
disable_login_form = false

[log]
mode = console
level = info

[plugin]
grafana-image-renderer = /var/lib/grafana/plugins/grafana-image-renderer
